<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creator Finance (prototype)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#0A0A0C;--s1:#131317;--s2:#1C1C22;--ln:#272730;--tx:#F3F0E8;--mut:#8F8D98;--gold:#E7B24A;--grn:#5BD6A2;--red:#FF6B5B;--on:#17120A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#F5F2EA;--s1:#FFF;--s2:#EEE9DE;--ln:#E1DBCD;--tx:#17161A;--mut:#6E6B75;--gold:#B27D14;--grn:#12935F;--red:#D2402E;--on:#fff}}
:root[data-theme="light"]{color-scheme:light;--bg:#F5F2EA;--s1:#FFF;--s2:#EEE9DE;--ln:#E1DBCD;--tx:#17161A;--mut:#6E6B75;--gold:#B27D14;--grn:#12935F;--red:#D2402E;--on:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:600 14px/1.45 Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,a{font:inherit;color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg)}
.in{max-width:480px;margin:auto;padding:0 18px}
header .in{display:flex;justify-content:space-between;align-items:center;height:56px}
.pw{position:relative}
.chip{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--ln);border-radius:99px;padding:5px 12px 5px 5px;cursor:pointer}
.av{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:12px}
.menu{display:none;position:absolute;top:44px;left:0;width:230px;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:6px;box-shadow:0 18px 40px #0007}
.menu.o{display:block}
.menu button{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:10px;border-radius:10px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--s2)}
.app{padding-bottom:100px}
.mut{color:var(--mut)}.s{font-size:12px}.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:18px;margin-top:12px}
.big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.seg{display:flex;background:var(--s1);border:1px solid var(--ln);border-radius:99px;padding:3px;margin-top:6px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:99px;cursor:pointer;color:var(--mut)}
.seg .on{background:var(--tx);color:var(--bg)}
.bar{display:flex;gap:2px;height:10px;border-radius:9px;overflow:hidden;background:var(--s2)}
.bar.sm{height:6px}.bar i{display:block;transition:width .6s}
.leg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.leg div{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}
.leg b{color:var(--tx);font-size:14px;margin-top:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
h2{font-size:16px;font-weight:800}
.r2{margin-top:14px}.r2 .bar{margin:6px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--ln)}
.red{color:var(--red)}
.btn{border:1px solid var(--ln);background:var(--s2);border-radius:99px;padding:8px 14px;font-size:12px;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--gold);color:var(--on);border-color:var(--gold);font-weight:800}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--mut)}
.tag.g{color:var(--grn);border-color:var(--grn)}.tag.y{color:var(--gold);border-color:var(--gold)}.tag.r{color:var(--red);border-color:var(--red)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.meta span{display:block;font-size:11px;color:var(--mut);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.t{font-size:17px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2 .card{margin-top:0}.g2 .big{font-size:30px}
.mom{display:flex;gap:10px;margin-top:14px}.mom>div{flex:1;text-align:center}
.cols{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:110px;margin-bottom:6px}
.cols i{display:block;width:10px;border-radius:4px 4px 0 0;min-height:2px}
.dash{border-style:dashed;color:var(--mut)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tabs .in{display:flex;gap:6px}
.tabs button{flex:1;border:0;background:none;padding:10px 0;color:var(--mut);cursor:pointer;border-radius:12px;position:relative}
.tabs .on{color:var(--tx)}.tabs .on::after{content:"";position:absolute;left:50%;bottom:2px;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:var(--gold)}
#bd{position:fixed;inset:0;z-index:20;background:#000a;opacity:0;pointer-events:none;transition:.3s}
#bd.o{opacity:1;pointer-events:auto}
#sh,#fm,#iv{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:auto;background:var(--s1);border:1px solid var(--ln);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#sh.o,#fm.o,#iv.o{transform:none}
#fm,#iv{max-height:92vh;overflow:auto}
.fl{display:block;margin-top:12px;font-size:12px;color:var(--mut)}
.fl input,.fg3 input{display:block;width:100%;margin-top:6px;background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;font:600 14px Manrope,system-ui,sans-serif}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.er{color:var(--red);font-size:12px;margin:10px 0;min-height:16px}
.fg3{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin-top:8px}.fg3 input{margin-top:0;font-size:13px;padding:10px}
.dc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:99px;padding:5px 11px;font-size:12px;color:var(--tx);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dc button{border:0;background:none;color:var(--mut);cursor:pointer;padding:0 0 0 2px;font-size:14px}
#sh textarea{width:100%;margin:12px 0;background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:12px;font:500 14px/1.5 Manrope,system-ui,sans-serif;resize:none}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
#toast.o{opacity:1;transform:translate(-50%,0)}
#cele{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#F3F0E8;background:radial-gradient(circle at 50% 40%,#3b290a 0%,#0A0A0C 65%)}
#cele.go{display:flex;animation:fi .5s}
#cele canvas{position:absolute;inset:0;pointer-events:none}
.ring{position:absolute;top:40%;left:50%;width:120px;height:120px;margin:-60px;border:2px solid #E7B24A;border-radius:50%;opacity:0}
.go .ring{animation:rg 1.8s ease-out forwards}.go .ring:nth-of-type(2){animation-delay:.25s}.go .ring:nth-of-type(3){animation-delay:.5s}
.ck{position:relative;width:120px;height:120px;margin-bottom:26px}
.ck circle,.ck path{fill:none;stroke:#E7B24A;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:290;stroke-dashoffset:290}
.go .ck circle{animation:dr .9s .15s ease-out forwards}.go .ck path{animation:dr .5s .85s ease-out forwards}
.go .ck{animation:pop .5s 1.2s}
#cele h1{font-size:34px;font-weight:800;letter-spacing:-.02em;opacity:0}
#cele .am{font-size:48px;font-weight:800;color:#E7B24A;margin:6px 0;font-variant-numeric:tabular-nums;opacity:0}
#cele p{color:#B9B5AA;opacity:0}
#cele .btn{margin-top:30px;opacity:0;background:#F3F0E8;color:#0A0A0C;border-color:#F3F0E8;position:relative}
.go h1{animation:up .6s 1s forwards}.go .am{animation:up .6s 1.15s forwards}.go p{animation:up .6s 1.4s forwards}.go .btn{animation:up .6s 1.9s forwards}
@keyframes fi{from{opacity:0}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes rg{0%{transform:scale(.4);opacity:.9}100%{transform:scale(4);opacity:0}}
@keyframes pop{50%{transform:scale(1.12)}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.go *,#cele.go{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head>
<body>
<header><div class="in"><div class="pw"><button class="chip" id="pm"><span class="av">C</span>Creator ▾</button><div class="menu" id="mn"></div></div><div class="sp" style="gap:8px"><button class="btn" id="snd">Sound on</button><button class="btn p" id="np">New project</button></div></div></header>
<main class="in app" id="v"></main>
<nav class="tabs"><div class="in" id="tb"></div></nav>
<div id="bd" data-x></div>
<div id="sh"><div class="sp"><h2 id="sht"></h2><button class="btn" data-x>Close</button></div><div class="seg" id="tn"></div><textarea id="tx" rows="8"></textarea><div class="sp"><a class="btn" id="wa" target="_blank" rel="noopener">Open in WhatsApp</a><button class="btn p" id="cp">Copy message</button></div></div>
<div id="fm"><div class="sp"><h2 id="fht">New project</h2><button class="btn" data-x>Close</button></div>
<label class="fl">Client name<input id="fb" placeholder="e.g. Nykaa" autocomplete="off"></label>
<label class="fl">Campaign or deliverable<input id="fc" placeholder="e.g. Festive reel series" autocomplete="off"></label>
<div class="fg"><label class="fl">Agreed fee (₹)<input id="ff" type="number" inputmode="numeric" min="0"></label><label class="fl">Received so far (₹)<input id="fa" type="number" inputmode="numeric" min="0" placeholder="0"></label></div>
<div class="fg"><label class="fl">Kickoff date<input id="fd" type="date"></label><label class="fl">Deliverable due<input id="fv" type="date"></label></div>
<label class="fl">Payment due<input id="fp" type="date"></label>
<div class="fl" style="margin-top:14px">Collaborators (optional): what you pay and what is paid so far</div>
<div class="fg3"><input id="fw" list="cl" placeholder="Name, role" autocomplete="off"><input id="fx" type="number" inputmode="numeric" min="0" placeholder="Fee ₹"><input id="fy" type="number" inputmode="numeric" min="0" placeholder="Paid ₹"></div>
<div class="fg3"><input id="fw2" list="cl" placeholder="Name, role" autocomplete="off"><input id="fx2" type="number" inputmode="numeric" min="0" placeholder="Fee ₹"><input id="fy2" type="number" inputmode="numeric" min="0" placeholder="Paid ₹"></div>
<label class="fl" style="display:flex;align-items:center;gap:10px"><input id="fdv" type="checkbox" style="width:18px;height:18px;margin:0;padding:0">Deliverable already delivered</label>
<label class="fl">Contract or agreement (PDF or images)<input id="fk" type="file" accept=".pdf,image/*" multiple></label><div id="fkl" class="acts" style="margin-top:8px"></div>
<datalist id="cl"><option value="Rohan, editor"><option value="Meera, videographer"></datalist>
<div class="er" id="fe"></div><button class="btn p" id="fs" style="width:100%;padding:13px">Create project</button></div>
<div id="iv"><div class="sp"><h2 id="ivt">Submit invoice</h2><button class="btn" data-x>Close</button></div>
<p class="mut s" id="ivs" style="margin-top:4px"></p>
<label class="fl">Invoice number<input id="iN" autocomplete="off"></label>
<div class="fg"><label class="fl">Invoice date<input id="iD" type="date"></label><label class="fl">Invoice amount (₹)<input id="iA" type="number" inputmode="numeric" min="0"></label></div>
<label class="fl">Payment due<input id="iP" type="date"></label>
<label class="fl">Invoice file (PDF or image)<input id="iF" type="file" accept=".pdf,image/*"></label><div id="iFL" class="acts" style="margin-top:8px"></div>
<div class="er" id="iE"></div><button class="btn p" id="iS" style="width:100%;padding:13px">Save invoice and draft message</button></div>
<div id="cele"><canvas id="cv"></canvas><i class="ring"></i><i class="ring"></i><i class="ring"></i>
<svg class="ck" viewBox="0 0 120 120"><circle cx="60" cy="60" r="46"/><path d="M38 61l15 15 29-32"/></svg>
<h1>Project closed</h1><div class="am" id="ca"></div><p id="cs"></p><p id="cs2"></p><button class="btn" id="cd">Back to projects</button></div>
<div id="toast"></div>
<script>
const TS='2026-10-24',D=s=>new Date(s+'T00:00:00'),T=D(TS),day=864e5;
const fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const dm=s=>D(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const diff=s=>Math.round((D(s)-T)/day);
const $=s=>document.querySelector(s);
const P=[
{id:1,b:'Nykaa',c:'Festive reel series',fee:120000,rec:60000,due:'2026-10-28',d:'2026-10-05',dl:'2026-10-27',dv:false,e:[['Rohan, editor',18000,9000],['Meera, videographer',12000,12000]]},
{id:2,b:'boAt',c:'Launch video',fee:85000,rec:0,due:'2026-10-15',d:'2026-10-02',dl:'2026-10-10',dv:true,e:[['Rohan, editor',9000,9000]]},
{id:3,b:'Mamaearth',c:'Skincare sponsored post',fee:60000,rec:60000,due:'2026-10-18',paid:'2026-10-20',d:'2026-10-01',dl:'2026-10-12',dv:true,e:[['Rohan, editor',6000,6000]]},
{id:4,b:'Zepto',c:'Quick-commerce reel',fee:45000,rec:0,due:'2026-11-05',d:'2026-10-20',dl:'2026-10-30',dv:false,e:[['Rohan, editor',9000,0]]},
{id:5,b:'Lenskart',c:'Eyewear collection shoot',fee:95000,rec:47500,due:'2026-11-10',d:'2026-10-22',dl:'2026-11-02',dv:false,e:[['Meera, videographer',15000,0]]},
{id:6,b:'Cult.fit',c:'Fitness challenge',fee:75000,rec:75000,due:'2026-09-20',paid:'2026-09-27',d:'2026-09-01',dl:'2026-09-12',dv:true,x:1,e:[['Rohan, editor',9000,9000]]},
{id:7,b:'Myntra',c:'End of reason sale',fee:110000,rec:110000,due:'2026-08-25',paid:'2026-08-22',d:'2026-08-01',dl:'2026-08-12',dv:true,x:1,e:[['Rohan, editor',9000,9000],['Meera, videographer',14000,14000]]},
{id:8,b:'Mivi',c:'Earbuds review',fee:50000,rec:50000,due:'2026-06-20',paid:'2026-07-04',d:'2026-06-05',dl:'2026-06-14',dv:true,x:1,e:[['Rohan, editor',9000,9000]]}];
const R={M:['Oct 2026','2026-10-01','2026-10-31'],Q:['Q3 FY27','2026-10-01','2026-12-31'],Y:['FY 2026–27','2026-04-01','2027-03-31']};
const S={tab:'d',per:'M',pf:'a',snd:1};let sh={};
const bal=p=>p.fee-p.rec,inPer=()=>{const[,a,b]=R[S.per];return P.filter(p=>p.d>=a&&p.d<=b)};
const seg=(a,k,cur)=>`<div class="seg">${a.map(([v,n])=>`<button data-${k}="${v}" class="${cur==v?'on':''}">${n}</button>`).join('')}</div>`;
const perSeg=()=>seg([['M','Month'],['Q','Quarter'],['Y','Year']],'k',S.per);
function agg(){const L=inPer();let fee=0,rec=0,od=0,et=0,ep=0,ex={};
L.forEach(p=>{fee+=p.fee;rec+=p.rec;if(bal(p)>0&&p.due<TS)od+=bal(p);p.e.forEach(([w,a,q])=>{ex[w]=ex[w]||[0,0];ex[w][0]+=a;ex[w][1]+=q;et+=a;ep+=q})});
return{L,fee,rec,od,tc:fee-rec-od,ex,et,ep}}
const lg=(n,v,c)=>`<div><span><i class="dot" style="background:var(${c})"></i>${n}</span><b>${fmt(v)}</b></div>`;
function attn(){const o=[];P.filter(p=>!p.x).forEach(p=>{const b=bal(p);
if(b>0){const n=diff(p.due);if(n<=7)o.push({p,k:'pay',n,t:n<0?'Overdue by '+(-n)+' days':n==0?'Due today':'Due in '+n+' days',s:fmt(b)})}
if(!p.dv){const n=diff(p.dl);if(n<=7)o.push({p,k:'work',n,t:n<0?'Deliverable is late':'Deliverable due in '+n+' days',s:'send for approval'})}});
return o.sort((x,y)=>x.n-y.n).slice(0,4)}
function dash(){const a=agg(),pc=x=>a.fee?x/a.fee*100:0,A=attn();
const ex=Object.entries(a.ex).map(([w,[t,q]])=>`<div class="r2"><div class="sp"><span>${w}</span><span class="mut s">${fmt(q)} of ${fmt(t)}</span></div><div class="bar sm"><i style="width:${t?q/t*100:0}%;background:var(--grn)"></i></div>${t>q?`<div class="mut s">${fmt(t-q)} to be paid</div>`:'<div class="s" style="color:var(--grn)">All paid</div>'}</div>`).join('');
return `${perSeg()}
<div class="card"><div class="mut s">Received in ${R[S.per][0]}</div><div class="big" id="cnt" data-v="${a.rec}">${fmt(a.rec)}</div><div class="mut s">of ${fmt(a.fee)} agreed</div>
<div class="bar" style="margin:18px 0 14px"><i style="width:${pc(a.rec)}%;background:var(--grn)"></i><i style="width:${pc(a.tc)}%;background:var(--gold)"></i><i style="width:${pc(a.od)}%;background:var(--red)"></i></div>
<div class="leg">${lg('Received',a.rec,'--grn')}${lg('To collect',a.tc,'--gold')}${lg('Overdue',a.od,'--red')}</div></div>
<div class="card"><div class="sp"><h2>Paid to your team</h2><span class="mut s">${fmt(a.et-a.ep)} to be paid</span></div>${ex||'<p class="mut">No collaborator costs in this period.</p>'}</div>
<div class="card"><h2>Needs your attention</h2>${A.map(x=>`<div class="row"><div><b>${x.p.b}</b><div class="s ${x.n<0?'red':'mut'}">${x.t}, ${x.s}</div></div><button class="btn p" data-dr="${x.p.id}:${x.k}">${x.k=='pay'?'Follow up':'Draft'}</button></div>`).join('')||'<p class="mut" style="margin-top:8px">All clear.</p>'}</div>
<p class="mut s" style="margin:16px 4px">Sample data. Figures cover only the projects you have recorded.</p>`}
const lk=(a,t)=>a&&a.length?`<div class="acts" style="align-items:center;margin-bottom:12px"><span class="mut s">${t}</span>${a.map(f=>`<a class="dc" href="${f.u}" target="_blank" rel="noopener">${f.n}</a>`).join('')}</div>`:'';
const att=p=>(p.inv?`<div class="s" style="margin-bottom:${p.inv.files.length?6:12}px"><span class="mut">Invoice</span> ${p.inv.no} for ${fmt(p.inv.amt)}, raised ${dm(p.inv.date)}</div>`:'')+lk(p.inv&&p.inv.files,'Invoice file')+lk(p.docs,'Contract');
function pc(p){const b=bal(p),n=diff(p.due),od=b>0&&n<0;
const st=p.x?'<span class="tag g">Closed</span>':b==0?'<span class="tag y">Paid in full</span>':od?`<span class="tag r">${-n} days overdue</span>`:'<span class="tag">Active</span>';
return `<div class="card"><div class="sp"><div><b class="t">${p.b}</b><div class="mut s">${p.c}</div></div>${st}</div>
<div class="sp" style="margin:16px 0 8px"><span>${fmt(p.rec)} <span class="mut">received</span></span><span class="mut">${fmt(p.fee)}</span></div><div class="bar sm"><i style="width:${p.rec/p.fee*100}%;background:var(--grn)"></i></div>
<div class="meta"><div><span>Payment</span>${b>0?fmt(b)+' due '+dm(p.due):'Settled'+(p.paid?' on '+dm(p.paid):'')}</div><div><span>Deliverable</span>${p.dv?'Delivered':'Due '+dm(p.dl)}</div></div>
${att(p)}<div class="acts">${p.x?`<button class="btn" data-ro="${p.id}">Reopen project</button>`:(b==0?`<button class="btn p" data-cl="${p.id}">Close project</button>`:`<button class="btn p" data-dr="${p.id}:pay">Follow up</button><button class="btn" data-rc="${p.id}">Mark received</button>`)+(p.dv?'':`<button class="btn" data-dr="${p.id}:work">Submit work</button>`)+`<button class="btn" data-iv="${p.id}">${p.inv?'Edit invoice':'Submit invoice'}</button><button class="btn" data-ed="${p.id}">Edit</button>`}</div></div>`}
function proj(){const L=P.filter(p=>S.pf=='c'?p.x:!p.x).sort((a,b)=>a.due<b.due?-1:1);
return seg([['a','Active'],['c','Closed']],'pf',S.pf)+(L.map(pc).join('')||'<p class="mut" style="margin-top:24px">Nothing here yet. Closed projects land here.</p>')}
function ana(){const L=inPer(),ds=P.map(p=>{const b=bal(p);return{p,d:p.paid&&b==0?Math.round((D(p.paid)-D(p.due))/day):b>0&&p.due<TS?-diff(p.due):null}}).filter(x=>x.d!==null&&L.includes(x.p));
